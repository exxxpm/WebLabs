<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Калькулятор</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm calc-card">
          <div class="card-body p-4 p-sm-4">
            <h1 class="h4 mb-3 calc-title">Калькулятор</h1>

            <div class="calc-panel rounded-4 p-3 p-sm-4">
              <div class="row g-3 align-items-start">
                <div class="col-12 col-sm-5">
                  <div class="calc-field" id="field-a">
                    <input id="a" type="text" class="form-control calc-control" placeholder="Число 1" autocomplete="off" />
                    <div id="err-a" class="invalid-feedback calc-error"></div>
                  </div>
                </div>

                <div class="col-12 col-sm-2">
                  <div class="calc-field">
                    <input type="hidden" id="op" value="+" />

                    <div class="dropdown">
                      <button
                        id="opBtn"
                        class="btn calc-op w-100 dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                        aria-label="Операция"
                      >+</button>

                      <ul class="dropdown-menu calc-op-menu w-100">
                        <li><button class="dropdown-item" type="button" data-op="+">+</button></li>
                        <li><button class="dropdown-item" type="button" data-op="-">−</button></li>
                        <li><button class="dropdown-item" type="button" data-op="*">×</button></li>
                        <li><button class="dropdown-item" type="button" data-op="/">÷</button></li>
                      </ul>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-sm-5">
                  <div class="calc-field" id="field-b">
                    <input id="b" type="text" class="form-control calc-control" placeholder="Число 2" autocomplete="off" />
                    <div id="err-b" class="invalid-feedback calc-error"></div>
                  </div>
                </div>
              </div>

              <button id="btn" class="btn w-100 mt-3 calc-btn" type="button" disabled>
                Получить результат
              </button>

              <div id="resultBox" class="mt-3 calc-result" aria-live="polite">
                <div id="resultLines">—</div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"></script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script src="./script.js"></script>
</body>
</html>
