<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Калькулятор</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-4">Калькулятор</h1>

            <div class="row g-3 align-items-start">
              <div class="col-12 col-sm-5">
                <input id="a" type="text" class="form-control" placeholder="Число 1" autocomplete="off" />
              </div>

              <div class="col-12 col-sm-2">
                <select id="op" class="form-select">
                  <option value="+">+</option>
                  <option value="-">-</option>
                  <option value="*">*</option>
                  <option value="/">/</option>
                </select>
              </div>

              <div class="col-12 col-sm-5">
                <input id="b" type="text" class="form-control" placeholder="Число 2" autocomplete="off" />
              </div>
            </div>

            <button id="btn" class="btn btn-danger w-100 mt-3" type="button" disabled>
              подсчитать
            </button>

            <div id="resultBox" class="border rounded p-3 mt-3 bg-light">
              <div id="resultLines">—</div>
            </div>
          </div>
        </div>

        <p class="text-muted small mt-3 mb-0">
          Вводи числа → выбирай операцию → жми «подсчитать».
        </p>
      </div>
    </div>
  </main>

  <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"></script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script src="./script.js"></script>
</body>
</html>
